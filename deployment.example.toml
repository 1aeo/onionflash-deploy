# All relative paths are resolved beside this file. Never put secrets here.
app_config = "onionflash.toml"
app_source = "../onionflash"
env_file = "secrets.env"
state_dir = "state"
app_python = ".venv/bin/python"
interval_minutes = 5

[network]
timeout_seconds = 30
attempts = 4
backoff_seconds = 2
backoff_cap_seconds = 30
jitter_seconds = 1
max_response_bytes = 8388608

[cloudflare]
worker_name = "onionflash"
account_id_env = "CLOUDFLARE_ACCOUNT_ID"
api_token_env = "CLOUDFLARE_API_TOKEN"
zone_token_env = "CLOUDFLARE_ZONE_TOKEN"
zone_id_env = "CLOUDFLARE_ZONE_ID"
api_base_url = "https://api.cloudflare.com/client/v4"
compatibility_date = "2026-11-08"
command_timeout_seconds = 240
max_files = 10000
max_file_bytes = 10485760
max_total_bytes = 104857600
verify_paths = ["index.html", "feed.xml", "feed.json"]

[spaces]
enabled = false
required = false
endpoint_url = "https://nyc3.digitaloceanspaces.com"
region = "nyc3"
bucket = "onionflash-data"
prefix = "onionflash/backups/"
access_key_env = "DO_SPACES_KEY"
secret_key_env = "DO_SPACES_SECRET"
backup_interval_seconds = 86400
retention_days = 30
